# Only this service; use an explicit project name and immutable image ID.
# Connection env file is root-owned mode 0600, outside the repository.
services:
  pitwall-learning-worker:
    image: ${PITWALL_LEARNING_IMAGE:?Pinned immutable worker image required}
    user: "100:101"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=33554432,mode=1777
    env_file:
      - ${PITWALL_LEARNING_ENV_FILE:?Protected worker connection env required}
    environment:
      PGUSER: pitwall_learning_worker
      PGAPPNAME: 3sm-pitwall-learning
    # De base-image (supabase/postgres) heeft een HEALTHCHECK die
    # `pg_isready -U postgres -h localhost` doet. Deze container draait geen
    # database, dus die melding is altijd unhealthy. Prik de healthcheck op
    # dezelfde PG*-variabelen als de worker zelf gebruikt.
    healthcheck:
      # Geen argumenten: pg_isready leest PGHOST/PGPORT/PGUSER/PGDATABASE uit
      # de env-file en test dus precies de database die de worker gebruikt.
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    networks: [supabase]
networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:?Existing database network required}
