<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { background: #0a0a0a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 40px 20px; }
    .container { max-width: 500px; margin: 0 auto; background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
    .header { background: linear-gradient(135deg, #f97316, #ea580c); padding: 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
    .body { padding: 30px; }
    .button { display: block; width: fit-content; margin: 24px auto; padding: 14px 32px; background: #f97316; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; letter-spacing: 1px; }
    .code { text-align: center; font-size: 30px; letter-spacing: 6px; font-weight: bold; color: #f97316; margin: 24px 0; }
    .footer { text-align: center; padding: 20px; color: #555; font-size: 12px; border-top: 1px solid #222; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>3 STRIPE MOTORSPORT</h1>
    </div>
    <div class="body">
      <p><strong>Je telefoonnummer is gewijzigd</strong></p>
        <p>Het telefoonnummer van je 3SM-account is gewijzigd van <strong>{{ .OldPhone }}</strong> naar <strong>{{ .Phone }}</strong>.</p>
        <p style="color:#666; font-size:13px;">Heb je dit niet zelf gedaan? Neem dan direct contact op met de organisatie.</p>
    </div>
    <div class="footer">© 2026 3 Stripe Motorsport</div>
  </div>
</body>
</html>
