server {
    listen 80;
    server_name _;

    # C7: geen nginx-versienummer in de Server-header en op foutpagina's.
    server_tokens off;

    root /var/www/3sm;
    index index.html;
    absolute_redirect off;

    # Temporary controlled-release maintenance gate. Remove after all release
    # validations pass; when present it prevents public access during the
    # code/database transition. (Staat live op 3sm-web; niet stilzwijgend laten
    # verdwijnen bij een config-uitrol.)
    if (-f /var/www/3sm/.maintenance) {
        return 503;
    }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Niet-gehashte bestanden (alle HTML, robots.txt, llms.txt, feed.xml) moeten
    # altijd hervalideren: een oude HTML verwijst naar gehashte chunks die na een
    # uitrol niet meer bestaan. "no-cache" verplicht die hervalidatie maar staat
    # opslag toe, dus een ongewijzigde pagina kost een 304 van 0 bytes.
    # Vóór deze regel had alléén /index.html een cache-header — met no-store, wat
    # elke keer een volledige download afdwong — en hadden de gegenereerde
    # routepagina's er géén, zodat een browser ze zelf mocht heuristisch cachen.
    # Locaties met een eigen add_header (assets, favicons, sitemap, de ZIP)
    # overschrijven deze regel bewust.
    add_header Cache-Control "no-cache" always;
    # ETag is de validator die hervalidatie goedkoop maakt. Cloudflare strippt de
    # ETag onderweg, dus de browser valt terug op Last-Modified — dat werkt ook
    # (gemeten: 304 met 0 bytes op /meedoen/). Expliciet aan laten staan dus.
    etag on;

    # Echte 404-pagina (noindex, geen homepage-canonical) voor alles wat geen
    # bestand en geen bekende app-route is. Een 403 (map zonder index.html, of een
    # deny) wordt bewust als 404 gepresenteerd: een 403 verraadt dat het pad bestaat
    # en levert in Search Console een crawl-anomalie op.
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html {
        internal;
    }

    # Interne app-shell voor geldige app-routes zonder geprerenderd bestand
    # (deep links, nieuwe uitslagen). 200 + noindex, nooit direct bereikbaar.
    location = /app-shell-fallback.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Eigen add_header wist de serverbrede Cache-Control; opnieuw zetten.
        add_header Cache-Control "no-cache" always;
    }

    # .route-html-manifest.json is een build-artefact met de volledige routemap
    # (inclusief alle /admin- en private paden). Nooit publiek serveren.
    location = /.route-html-manifest.json {
        deny all;
    }

    # De SPA-shell mag nooit verouderen: hij verwijst naar de huidige hashed
    # chunks. Dat gebeurt nu met het serverbrede "no-cache" hierboven — streng
    # genoeg (elke keer hervalideren) maar zonder de volledige download die
    # no-store afdwong. Een eigen location is daardoor niet meer nodig.

    # Favicons — version-busted in HTML (?v=YYYYMMDD); moderate cache is safe
    location ~* ^/(favicon\.ico|favicon\.svg|favicon-[0-9]+x[0-9]+\.png|apple-touch-icon\.png)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Web app manifest. Some nginx installs do not know .webmanifest by default
    # and otherwise serve it as application/octet-stream.
    # De layered trackmap-manifest is een build-artefact (alleen bij een deploy
    # anders). Expliciet "no-cache" maakt het gedrag deterministisch: de browser
    # MOET hervalideren, krijgt een 304 met 0 bytes en gebruikt zijn kopie.
    location = /tracks/layered/manifest.json {
        add_header Cache-Control "no-cache";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # robots.txt expliciet als text/plain (niet afhankelijk van mime.types)
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # sitemap.xml expliciet als application/xml (de .xml-extensie uit mime.types
    # levert anders text/xml); kort cachebaar omdat de SEO-refresh hem elke
    # ~5 minuten opnieuw wegschrijft.
    location = /sitemap.xml {
        types { application/xml xml; }
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    # Cache hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Extension ZIP is linked from the member PDF without a version query.
    # Force revalidation so users always receive the newest uploaded ZIP.
    location = /iracing-content-extension.zip {
        default_type application/zip;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Utility-/beheerboom: geldige app-routes (de HTML draagt al noindex), maar
    # nooit indexeren en altijd de shell serveren. Staat vóór de algemene
    # app-route-regex zodat deze paden de X-Robots-Tag krijgen.
    location ~ ^/(admin|news-editor|stewards|koppel|simhub-koppelen|profile|auth)(/|$) {
        rewrite ^/([^.]*[^/])$ /$1/ permanent;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app-shell-fallback.html;
    }

    # Endurance-bèta: geldige live app-route, bewust niet geprerenderd. Deep links
    # moeten blijven werken, maar de boom hoort niet in de index.
    location ^~ /endurance {
        rewrite ^/([^.]*[^/])$ /$1/ permanent;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app-shell-fallback.html;
    }

    # /en/ is geen eigen pagina (alleen /en/join/). De kale vorm en de
    # case-varianten (/EN/, /En/Join) horen door te sturen in plaats van te
    # eindigen op een 404 — een oude of handmatig getypte link moet werken.
    # Alleen de vorm mét hoofdletters wordt omgeleid, anders zou /en/join/ naar
    # zichzelf verwijzen. Een algemene lowercase-redirect kan nginx niet maken.
    location ~ ^/[Ee][Nn](/[Jj][Oo][Ii][Nn])?/?$ {
        if ($uri ~ "[A-Z]") {
            return 301 https://3stripemotorsport.cc/en/join/;
        }
        try_files $uri $uri/ /app-shell-fallback.html;
    }
    location = /en {
        return 301 https://3stripemotorsport.cc/en/join/;
    }
    location = /en/ {
        return 301 https://3stripemotorsport.cc/en/join/;
    }

    # Secties zonder subpagina's. /calendar/, /standings/, /meedoen/, /support/ en
    # /homepage-prototype/ hebben geen kinderen, dus een pad eronder bestaat per
    # definitie niet: echte 404 in plaats van een lege noindex-app-shell.
    # Voor /drivers/, /results/, /news/, /teams/ en /seasons/ blijft de shell
    # staan: daar bepaalt de database of een slug bestaat, en een verse uitslag of
    # nieuwe coureur heeft nog geen geprerenderd bestand.
    # [^.]+ en niet .+ — anders matcht ook /meedoen/index.html, en dat is precies
    # het bestand waar de map bij een verzoek aan /meedoen/ intern naar verwijst.
    location ~ ^/(calendar|standings|meedoen|support|homepage-prototype)/[^.]+$ {
        return 404;
    }

    # Publieke, indexeerbare app-routes (moet in sync blijven met de
    # <Route>-lijst in src/App.tsx): deze mogen terugvallen op de SPA-shell.
    location ~ ^/(homepage-prototype|calendar|standings|drivers|teams|results|news|seasons|meedoen|support)(/|$) {
        rewrite ^/([^.]*[^/])$ /$1/ permanent;
        try_files $uri $uri/ /app-shell-fallback.html;
    }

    # Fallback: alleen bestaande bestanden. Onbekende paden krijgen een echte 404
    # in plaats van 200 + homepage-shell (soft-404).
    location / {
        rewrite ^/([^.]*[^/])$ /$1/ permanent;
        try_files $uri $uri/ =404;
    }
}
