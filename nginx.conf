server {
    listen 80;
    server_name _;

    root /var/www/3sm;
    index index.html;
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Never let the SPA shell go stale. It points to the current hashed chunks.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Favicons — version-busted in HTML (?v=YYYYMMDD); moderate cache is safe
    location ~* ^/(favicon\.ico|favicon\.svg|favicon-[0-9]+x[0-9]+\.png|apple-touch-icon\.png)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Web app manifest. Some nginx installs do not know .webmanifest by default
    # and otherwise serve it as application/octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Extension ZIP is linked from the member PDF without a version query.
    # Force revalidation so users always receive the newest uploaded ZIP.
    location = /iracing-content-extension.zip {
        default_type application/zip;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # SPA fallback — all routes go to index.html
    # Redirect non-trailing-slash page URLs to trailing-slash version (canonical)
    location / {
        rewrite ^/([^.]*[^/])$ /$1/ permanent;
        try_files $uri $uri/ /index.html;
    }
}
